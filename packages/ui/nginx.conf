server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de las llamadas a la API hacia el backend. En docker-compose el
    # backend es el servicio `api`; nginx y api comparten red interna, asi que
    # el navegador habla solo con nginx (mismo origen, sin CORS).
    # proxy_pass SIN barra final -> se conserva el URI completo:
    #   /api/analyze -> http://api:3000/api/analyze (el backend sirve bajo /api).
    location /api/ {
        # Resolver de Docker (127.0.0.11) + host en variable: fuerza a nginx a
        # re-resolver el DNS del servicio `api` en runtime en vez de cachear su
        # IP al arrancar. Asi, si el contenedor `api` se recrea (nueva IP),
        # nginx no queda apuntando a una IP muerta (evita 502 persistentes).
        # Se agrega $request_uri para conservar el path completo (/api/...),
        # porque al usar variables en proxy_pass nginx no lo hace automatico.
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Permite subir imagenes por encima del limite por defecto de nginx (1m).
        # El backend aplica el limite real (MAX_FILE_SIZE_MB); nginx solo deja pasar.
        client_max_body_size 20m;
    }

    # SPA: sirve los estaticos y cae a index.html para cualquier ruta del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
